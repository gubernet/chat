name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    check:
        name: Lint, types, tests and build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Run oxlint
              run: pnpm lint
            - name: Check formatting
              run: pnpm format:check
            - name: Run TypeScript
              run: pnpm type-check
            - name: Run unit tests
              run: pnpm test
            - name: Build
              run: pnpm build
